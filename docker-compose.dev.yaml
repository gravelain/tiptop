services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: bdd_user
      POSTGRES_PASSWORD: bdd_pass
      POSTGRES_DB: mydatabase_dev
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bdd_user", "-d", "mydatabase_dev"]
      interval: 30s
      retries: 5
      start_period: 15s
      timeout: 5s
    ports:
      - "5432:5432"
    volumes:
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - ./apps/backend/docker-entrypoint-init-db.d:/docker-entrypoint-initdb.d
      - pg_db_data:/var/lib/postgresql/data
    networks:
      - tiptop-network

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile.dev
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432 
      POSTGRES_USER: bdd_user
      POSTGRES_PASSWORD: bdd_pass
      POSTGRES_DB: mydatabase_dev
      DATABASE_URL: postgresql://bdd_user:bdd_pass@postgres:5432/mydatabase_dev 
    entrypoint: ["/usr/src/app/docker-entrypoint.sh"]
    command: ["php-fpm"]
    env_file:
      - apps/backend/.env
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_node_modules:/usr/src/app/node_modules
      - ./apps/backend/.env:/var/www/html/.env
    networks:
      - tiptop-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`backend.dev.tiptop.com`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=5001"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
    ports:
      - "3002:4200"
    volumes:
      - ./apps/frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    networks:
      - tiptop-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`frontend.dev.tiptop.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=3002"

networks:
  tiptop-network:
    driver: bridge

volumes:
  pg_db_data:
  backend_node_modules:
  frontend_node_modules:
