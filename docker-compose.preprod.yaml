services:
  backend:
    image: thierrytemgoua98/mon-backend:latest
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER_preprod}:${MYSQL_PASSWORD_preprod}@mysql:3306/${MYSQL_DATABASE_preprod}
    ports:
      - "5002:5000"  # Backend sur port 5002 en préprod
    networks:
      - tiptop-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`backend.preprod.tiptop.com`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=5002"

  frontend:
    image: thierrytemgoua98/mon-frontend:latest
    environment:
      NODE_ENV: production
    ports:
      - "3002:8081"  # Frontend sur port 3002 en préprod
    networks:
      - tiptop-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`frontend.preprod.tiptop.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3002"

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE_dev}
      MYSQL_USER: ${MYSQL_USER_dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD_dev}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "${MYSQL_USER_dev}", "-p${MYSQL_PASSWORD_dev}"]
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 5s
    networks:
      - tiptop-network

  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER_preprod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_preprod}
      POSTGRES_DB: ${POSTGRES_DB_preprod}
    ports:
      - "5435:5432"  # PostgreSQL sur port 5435 en préprod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tiptop-network

networks:
  tiptop-network:
    driver: bridge

volumes:
  mysql_data:
  postgres_data:
