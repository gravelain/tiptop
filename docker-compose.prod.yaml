services:
  backend:
    image: thierrytemgoua98/mon-backend:latest
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://backend:backendpass@postgres_backend:5434/backenddb
    ports:
      - "5003:5000"
    networks:
      - tiptop-network

  frontend:
    image: thierrytemgoua98/mon-frontend:latest
    environment:
      NODE_ENV: production
    ports:
      - "3003:8081"
    networks:
      - tiptop-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`dsp5-archi-f24a-15m-g3.fr`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.middlewares=redirect-to-non-www"

  postgres_backend:
    image: postgres:14
    environment:
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backendpass
      POSTGRES_DB: backenddb
    ports:
      - "5434:5432"
    volumes:
      - backend_db_data:/var/lib/postgresql/data
    networks:
      - tiptop-network

networks:
  tiptop-network:
    driver: bridge

volumes:
  backend_db_data:
