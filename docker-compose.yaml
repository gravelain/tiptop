version: '3.8'

services:
  # Traefik - Reverse Proxy
  traefik:
    image: traefik:v2.10
    command:
      - --providers.docker
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=admin@tiptop.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik_certificates:/letsencrypt
    networks:
      - tiptop-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`traefik.tiptop.com`)"

  # Prometheus - Surveillance
  prometheus:
    image: prom/prometheus:v2.33.1
    container_name: prometheus
    volumes:
      - prometheus_data:/prometheus
    networks:
      - tiptop-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.tiptop.com`)"

  # Grafana - Visualisation des métriques
  grafana:
    image: grafana/grafana:8.5.5
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - tiptop-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.tiptop.com`)"

  # Jenkins - CI/CD Server
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - tiptop-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jenkins.rule=Host(`jenkins.tiptop.com`)"

  # SonarQube - Code Quality & Analysis
  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    environment:
      - SONARQUBE_JDBC_URL=jdbc:postgresql://postgres_sonarqube:5432/mydatabase_prod
      - SONARQUBE_JDBC_USERNAME=sonar
      - SONARQUBE_JDBC_PASSWORD=sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - tiptop-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarqube.rule=Host(`sonarqube.tiptop.com`)"
    depends_on:
      - postgres_sonarqube

  # PostgreSQL - Base de données pour SonarQube
  postgres_sonarqube:
    image: postgres:14
    container_name: postgres_sonarqube
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: mydatabase_prod
    volumes:
      - postgres_sonarqube_data:/var/lib/postgresql/data
    networks:
      - tiptop-network

  # Loki - Logs
  loki:
    image: grafana/loki:2.5.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - tiptop-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=Host(`loki.tiptop.com`)"

networks:
  tiptop-network:
    name: my-project-the-tiptop_tiptop-network
    driver: bridge

volumes:
  prometheus_data:       # Volume pour stocker les données de Prometheus
  grafana_data:          # Volume pour stocker les données de Grafana
  jenkins_home:          # Volume pour stocker les données de Jenkins
  traefik_certificates:  # Volume pour stocker les certificats de Traefik
  sonarqube_data:        # Volume pour stocker les données PostgreSQL pour SonarQube
  sonarqube_extensions:  # Volume pour stocker les extensions/plugins de SonarQube
  loki_data:             # Volume pour stocker les logs de Loki
  postgres_sonarqube_data: # Volume pour stocker les données de PostgreSQL pour SonarQube
