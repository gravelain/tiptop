services:
  # Traefik (pour tous les environnements)
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - --providers.docker
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik_certificates:/letsencrypt
    networks:
      - tiptop-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.redirect-to-non-www.redirectregex.regex=^https://www\\.(.*)"
      - "traefik.http.middlewares.redirect-to-non-www.redirectregex.replacement=https://$1"
      - "traefik.http.middlewares.redirect-to-non-www.redirectregex.permanent=true"

  # Services de Monitoring (Prometheus et Grafana)
  prometheus:
    image: prom/prometheus:v2.33.1
    container_name: prometheus
    volumes:
      - prometheus_data:/prometheus
    networks:
      - tiptop-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN_WK}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prometheus.middlewares=redirect-to-non-www"

  grafana:
    image: grafana/grafana:8.5.5
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - tiptop-network
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN_WK}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana.middlewares=redirect-to-non-www"

  # Jenkins
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - tiptop-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jenkins.rule=Host(`jenkins.${DOMAIN_WK}`)"
      - "traefik.http.routers.jenkins.entrypoints=websecure"
      - "traefik.http.routers.jenkins.tls.certresolver=letsencrypt"
      - "traefik.http.routers.jenkins.middlewares=redirect-to-non-www"

  # SonarQube
  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    environment:
      - SONARQUBE_JDBC_URL=jdbc:postgresql://postgres_sonarqube:5432/mydatabase_prod
      - SONARQUBE_JDBC_USERNAME=sonar
      - SONARQUBE_JDBC_PASSWORD=sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - tiptop-network
    depends_on:
      - postgres_sonarqube
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarqube.rule=Host(`sonarqube.${DOMAIN_WK}`)"
      - "traefik.http.routers.sonarqube.entrypoints=websecure"
      - "traefik.http.routers.sonarqube.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sonarqube.middlewares=redirect-to-non-www"

  postgres_sonarqube:
    image: postgres:14
    container_name: postgres_sonarqube
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: mydatabase_prod
    volumes:
      - postgres_sonarqube_data:/var/lib/postgresql/data
    networks:
      - tiptop-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (avec variables d'environnement dynamiques)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.${NODE_ENV}
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
    entrypoint: ["php-fpm"]
    command: ["php-fpm"]
    env_file:
      - ./apps/backend/.env.${NODE_ENV}
    ports:
      - "5000:5000"
    volumes:
      - backend_node_modules:/usr/src/app/node_modules
      - ./apps/backend:/var/www/html
      - ./apps/backend/.env:/var/www/html/.env
      - backend_db:/var/www/html/var/data
    networks:
      - tiptop-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"

  # Frontend
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.${NODE_ENV}
    environment:
      NODE_ENV: ${NODE_ENV}
    ports:
      - "3000:4200"
    volumes:
      - ./apps/frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    networks:
      - tiptop-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"

  # PostgreSQL Backend
  postgres_backend:
    image: postgres:14
    environment:
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backendpass
      POSTGRES_DB: backenddb
    ports:
      - "5432:5432"
    volumes:
      - backend_db_data:/var/lib/postgresql/data
    networks:
      - tiptop-network
    restart: unless-stopped

  # Loki (logging)
  loki:
    image: grafana/loki:2.5.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - tiptop-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=Host(`loki.${DOMAIN_WK}`)"
      - "traefik.http.routers.loki.entrypoints=websecure"
      - "traefik.http.routers.loki.tls.certresolver=letsencrypt"
      - "traefik.http.routers.loki.middlewares=redirect-to-non-www"

networks:
  tiptop-network:
    name: my-project-the-tiptop_tiptop-network
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  jenkins_home:
  traefik_certificates:
  sonarqube_data:
  sonarqube_extensions:
  backend_node_modules:
  frontend_node_modules:
  backend_db:
  loki_data:
  postgres_sonarqube_data:
  backend_db_data: